<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b10"/>
      <stop offset="55%" stop-color="#1a3140"/>
      <stop offset="100%" stop-color="#3a2a1c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 210) rotate(90) scale(220)">
      <stop stop-color="#fff6e4"/>
      <stop offset="0.4" stop-color="#d4a35a"/>
      <stop offset="1" stop-color="#1e3a45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="860" cy="210" r="180" fill="url(#sun)"/>
  <circle cx="180" cy="120" r="2" fill="#eef3f7" opacity="0.7"/>
  <circle cx="260" cy="180" r="3" fill="#eef3f7" opacity="0.55"/>
  <circle cx="340" cy="90" r="2" fill="#eef3f7" opacity="0.8"/>
  <circle cx="480" cy="150" r="2" fill="#eef3f7" opacity="0.5"/>
  <circle cx="620" cy="80" r="2" fill="#eef3f7" opacity="0.65"/>
  <text x="88" y="300" fill="#eef3f7" font-family="Georgia, serif" font-size="64" font-weight="500">The Soul Searchers</text>
  <text x="88" y="360" fill="#d4a35a" font-family="Arial, sans-serif" font-size="26">A cycling blog — tours, roads, travel by bike.</text>
</svg>
