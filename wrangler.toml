# Cloudflare Worker (thenewsoulsearchersblog) — keep this in sync with the live repo.
name = "thenewsoulsearchersblog"
main = "cloudflare/cms-oauth-worker.js"
compatibility_date = "2026-08-23"

[assets]
directory = "./dist"
binding = "ASSETS"
# OAuth routes must hit the Worker before the static admin files.
run_worker_first = ["/auth", "/callback"]
