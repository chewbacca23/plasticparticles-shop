# Must name the Worker that owns thenewsoulsearchers.de and holds the GitHub
# OAuth secrets. `wrangler deploy` targets this name, so pointing it at the
# repo name instead sent deploys to a Worker nobody visits, leaving the live
# site stale while sibling Workers built fine.
name = "thenewsoulsearchersblogc"
main = "cloudflare/cms-oauth-worker.js"
compatibility_date = "2026-08-23"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every public page must hit the Worker so Looks can count the open.
# /api/looks is challenged by Bot Fight, so beacons never arrived.
run_worker_first = true

# Durable Looks counts (survives deploys). Create the namespace in the
# Cloudflare dashboard (CLOUDFLARE.md → Looks storage), then uncomment
# these three lines and paste the namespace id.
# [[kv_namespaces]]
# binding = "STATS"
# id = "PASTE_KV_NAMESPACE_ID_HERE"
