# Cloudflare Pages (monorepo)
# Connect repo in dashboard; these values match the UI.

name = soul-searchers
pages_build_output_dir = "dist"

[build]
command = "npm run build"
cwd = "soul-searchers"

# In Cloudflare Pages UI also set:
# - Production branch: main
# - Root directory: soul-searchers
# - Environment: NODE_VERSION = 22
